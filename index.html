<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess RPG - Tactical Battle Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Chess RPG</h1>
            <div class="game-info">
                <div class="turn-indicator">
                    <span id="current-turn">White's Turn</span>
                </div>
                <div class="dice-container">
                    <button id="roll-dice-btn">Roll Dice</button>
                    <div id="dice-result" class="dice-display"></div>
                </div>
            </div>
        </header>
        
        <main>
            <div class="board-container">
                <div id="chess-board" class="chess-board"></div>
            </div>
            
            <aside class="game-panel">
                <div class="piece-info">
                    <h3>Selected Piece</h3>
                    <div id="selected-piece-info"></div>
                </div>
                
                <div class="abilities">
                    <h3>Abilities</h3>
                    <div id="abilities-container"></div>
                </div>
                
                <div class="game-log">
                    <h3>Battle Log</h3>
                    <div id="battle-log"></div>
                </div>
            </aside>
        </main>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
